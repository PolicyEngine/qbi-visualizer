[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qbi-visualizer-backend"
version = "0.1.0"
description = "Backend API for QBI Computation Visualizer"
authors = [
    {name = "PolicyEngine", email = "hello@policyengine.org"}
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    # Pinned exactly so deployed tax results can't drift between installs;
    # bump deliberately (keep in sync with modal_app.py).
    "policyengine-us==1.669.0",
    # policyengine-us does not upper-bound core; newer cores break 1.669.0
    # ("mixes computation modes" on variable load). Pin the known-good pair.
    "policyengine-core==3.25.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
